services:
  social-poster:
    image: ${SOCIAL_POSTER_IMAGE:-ghcr.io/maxpetrusenko/social-poster:main}
    pull_policy: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/social-poster.db
      TZ: ${TZ:-America/New_York}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
