name: Fast Coolify Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-social-poster
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/maxpetrusenko/social-poster
  IMAGE_TAG: sha-${{ github.sha }}
  PRODUCTION_URL: https://smmagent.app
  COOLIFY_UUID: ch6cjsgcqn6afd5052etgvwn
  COOLIFY_PORT: "3000"
  COOLIFY_HEALTH_PATH: /api/health

jobs:
  gate:
    name: Local Gates
    runs-on: ubuntu-latest
    outputs:
      duration_seconds: ${{ steps.gate-duration.outputs.seconds }}
    steps:
      - name: Start gate timer
        id: gate-timer
        shell: bash
        run: echo "started_at=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Deploy workflow regression
        run: npm run test:deploy-workflow

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: E2E tests
        run: npm run test:e2e:ci

      - name: Browser tests
        run: npm run test:browser

      - name: Summarize local gates
        id: gate-duration
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          duration_seconds=$(($(date +%s) - ${{ steps.gate-timer.outputs.started_at }}))
          echo "seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Local Gates"
            echo "- Result: ${{ job.status }}"
            echo "- Duration: ${duration_seconds}s"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build and Push GHCR Image
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write
    outputs:
      duration_seconds: ${{ steps.build-duration.outputs.seconds }}
    steps:
      - name: Start build timer
        id: build-timer
        shell: bash
        run: echo "started_at=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize image build
        id: build-duration
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          duration_seconds=$(($(date +%s) - ${{ steps.build-timer.outputs.started_at }}))
          echo "seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Image Build"
            echo "- Result: ${{ job.status }}"
            echo "- Duration: ${duration_seconds}s"
            echo "- Image: ${IMAGE_NAME}:${IMAGE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Trigger Coolify Deploy
    runs-on: ubuntu-latest
    needs:
      - gate
      - build
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]') }}
    timeout-minutes: 20
    outputs:
      deployment_uuid: ${{ steps.coolify-deploy.outputs.deployment_uuid }}
      deployment_status: ${{ steps.coolify-deploy.outputs.deployment_status }}
      image_tag: ${{ steps.coolify-deploy.outputs.image_tag }}
      previous_image_tag: ${{ steps.coolify-deploy.outputs.previous_image_tag }}
      backup_path: ${{ steps.coolify-deploy.outputs.backup_path }}
      rollout_seconds: ${{ steps.coolify-deploy.outputs.rollout_seconds }}
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN || secrets.COOLIFY_TOKEN }}
      COOLIFY_SSH_HOST: ${{ secrets.COOLIFY_SSH_HOST || '173.249.52.27' }}
      COOLIFY_SSH_USER: ${{ secrets.COOLIFY_SSH_USER || 'root' }}
      COOLIFY_SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_PRIVATE_KEY }}
      COOLIFY_SSH_KNOWN_HOSTS: ${{ secrets.COOLIFY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Start deploy timer
        id: deploy-timer
        shell: bash
        run: echo "started_at=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Coolify application over private SSH path
        id: coolify-deploy
        shell: bash
        env:
          BACKUP_LABEL: deploy-${{ github.sha }}
          BACKUP_SQLITE_BEFORE_DEPLOY: "true"
          READ_PREVIOUS_IMAGE_TAG: "true"
        run: bash scripts/ci/coolify-image-deploy.sh

      - name: Summarize deploy timing
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          format_duration() {
            local value="${1:-}"
            if [ -z "${value}" ]; then
              printf 'n/a'
              return
            fi
            local minutes=$((value / 60))
            local seconds=$((value % 60))
            printf '%dm %02ds' "${minutes}" "${seconds}"
          }

          deploy_seconds=$(($(date +%s) - ${{ steps.deploy-timer.outputs.started_at }}))
          gate_seconds="${{ needs.gate.outputs.duration_seconds }}"
          build_seconds="${{ needs.build.outputs.duration_seconds }}"
          rollout_seconds="${{ steps.coolify-deploy.outputs.rollout_seconds }}"
          healthcheck_seconds="${{ steps.coolify-deploy.outputs.healthcheck_seconds }}"
          backup_path="${{ steps.coolify-deploy.outputs.backup_path }}"
          deployment_uuid="${{ steps.coolify-deploy.outputs.deployment_uuid }}"
          deployment_status="${{ steps.coolify-deploy.outputs.deployment_status }}"
          poll_attempts="${{ steps.coolify-deploy.outputs.poll_attempts }}"

          {
            echo "### Production Deploy"
            echo "- Result: ${{ job.status }}"
            echo "- Gate duration: $(format_duration "${gate_seconds}")"
            echo "- Image build duration: $(format_duration "${build_seconds}")"
            echo "- Deploy job duration: $(format_duration "${deploy_seconds}")"
            echo "- Coolify rollout duration: $(format_duration "${rollout_seconds}")"
            echo "- Healthcheck duration: $(format_duration "${healthcheck_seconds}")"
            echo "- Coolify deployment: ${deployment_uuid:-n/a}"
            echo "- Final Coolify status: ${deployment_status:-n/a}"
            echo "- Poll attempts: ${poll_attempts:-0}/90"
            echo "- SQLite backup: ${backup_path:-n/a}"
            echo "- Image: ${IMAGE_NAME}:${IMAGE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"

  canary:
    name: Public Production Canary
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    outputs:
      duration_seconds: ${{ steps.public-canary.outputs.duration_seconds }}
    steps:
      - name: Verify public production routes
        id: public-canary
        shell: bash
        run: |
          set -euo pipefail

          started_at=$(date +%s)
          health_url="${PRODUCTION_URL}/health"
          api_health_url="${PRODUCTION_URL}/api/health"

          log() {
            printf '[%s] %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$*"
          }

          curl_public_json() {
            local url="$1"
            local output_file="$2"
            local status

            status="$(
              curl --connect-timeout 10 --max-time 20 --silent --show-error \
                --retry 6 --retry-delay 5 --retry-all-errors \
                --user-agent "Mozilla/5.0 SocialPosterDeployCanary/1.0" \
                --header "Accept: application/json,text/plain,*/*" \
                --header "Cache-Control: no-cache" \
                --output "${output_file}" \
                --write-out "%{http_code}" \
                "${url}" || true
            )"

            if [ "${status}" = "403" ]; then
              echo "::warning::Public canary was blocked by the edge WAF for ${url}; private production health already passed."
              return 10
            fi
            if ! [[ "${status}" =~ ^[0-9]+$ ]] || [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              cat "${output_file}" >&2 || true
              echo "::error::Public canary returned HTTP ${status} for ${url}"
              return 1
            fi
          }

          log "Checking public health endpoint: ${health_url}"
          health_file="$(mktemp)"
          set +e
          curl_public_json "${health_url}" "${health_file}"
          health_exit=$?
          set -e
          if [ "${health_exit}" -eq 10 ]; then
            duration_seconds=$(($(date +%s) - started_at))
            echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"
            {
              echo "### Public Production Canary"
              echo "- Result: edge-blocked"
              echo "- Duration: ${duration_seconds}s"
              echo "- Blocked: ${health_url}"
              echo "- Note: private production health already passed in the deploy job."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          elif [ "${health_exit}" -ne 0 ]; then
            exit "${health_exit}"
          fi
          python3 -c '
          import json, sys
          payload = json.load(open(sys.argv[1]))
          if payload.get("ok") is not True:
              raise SystemExit(f"public /health returned unexpected payload: {payload}")
          ' "${health_file}"

          log "Checking public app health endpoint: ${api_health_url}"
          api_health_file="$(mktemp)"
          set +e
          curl_public_json "${api_health_url}" "${api_health_file}"
          api_health_exit=$?
          set -e
          if [ "${api_health_exit}" -eq 10 ]; then
            duration_seconds=$(($(date +%s) - started_at))
            echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"
            {
              echo "### Public Production Canary"
              echo "- Result: edge-blocked"
              echo "- Duration: ${duration_seconds}s"
              echo "- Blocked: ${api_health_url}"
              echo "- Note: private production health already passed in the deploy job."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          elif [ "${api_health_exit}" -ne 0 ]; then
            exit "${api_health_exit}"
          fi
          python3 -c '
          import json, sys
          payload = json.load(open(sys.argv[1]))
          status = payload.get("status")
          drift = payload.get("schedules", {}).get("drift")
          if status != "ok":
              raise SystemExit(f"public /api/health status is {status!r}: {payload}")
          if drift != 0:
              raise SystemExit(f"public /api/health schedule drift is {drift!r}: {payload}")
          ' "${api_health_file}"

          duration_seconds=$(($(date +%s) - started_at))
          echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"
          log "Public production canary passed in ${duration_seconds}s"

          {
            echo "### Public Production Canary"
            echo "- Result: passed"
            echo "- Duration: ${duration_seconds}s"
            echo "- Checked: ${health_url}"
            echo "- Checked: ${api_health_url}"
          } >> "${GITHUB_STEP_SUMMARY}"

  rollback:
    name: Roll Back Failed Canary
    runs-on: ubuntu-latest
    needs:
      - deploy
      - canary
    if: ${{ always() && needs.deploy.result == 'success' && needs.canary.result == 'failure' && needs.deploy.outputs.previous_image_tag != '' && needs.deploy.outputs.previous_image_tag != needs.deploy.outputs.image_tag }}
    timeout-minutes: 20
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN || secrets.COOLIFY_TOKEN }}
      COOLIFY_SSH_HOST: ${{ secrets.COOLIFY_SSH_HOST || '173.249.52.27' }}
      COOLIFY_SSH_USER: ${{ secrets.COOLIFY_SSH_USER || 'root' }}
      COOLIFY_SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_PRIVATE_KEY }}
      COOLIFY_SSH_KNOWN_HOSTS: ${{ secrets.COOLIFY_SSH_KNOWN_HOSTS }}
      IMAGE_TAG: ${{ needs.deploy.outputs.previous_image_tag }}
      VERIFY_PUBLIC: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Roll back Coolify image tag
        id: rollback-deploy
        shell: bash
        env:
          OUTPUT_PREFIX: rollback_
        run: bash scripts/ci/coolify-image-deploy.sh

      - name: Summarize rollback
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Rollback"
            echo "- Result: ${{ job.status }}"
            echo "- Rolled back from: ${{ needs.deploy.outputs.image_tag }}"
            echo "- Rolled back to: ${{ needs.deploy.outputs.previous_image_tag }}"
            echo "- Coolify rollback deployment: ${{ steps.rollback-deploy.outputs.rollback_deployment_uuid || 'n/a' }}"
            echo "- Final rollback status: ${{ steps.rollback-deploy.outputs.rollback_deployment_status || 'n/a' }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  report:
    name: Write Deploy Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    needs:
      - gate
      - build
      - deploy
      - canary
      - rollback
    if: always()
    steps:
      - name: Write report artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deploy-report
          report_file="deploy-report/${GITHUB_RUN_ID}.md"
          {
            echo "# Social Poster Production Deploy"
            echo
            echo "- Workflow run: ${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Image: ${IMAGE_NAME}:${{ needs.deploy.outputs.image_tag || env.IMAGE_TAG }}"
            echo "- Previous image: ${{ needs.deploy.outputs.previous_image_tag || 'unknown' }}"
            echo "- SQLite backup: ${{ needs.deploy.outputs.backup_path || 'n/a' }}"
            echo "- Production URL: ${PRODUCTION_URL}"
            echo "- Gate: ${{ needs.gate.result }} (${{ needs.gate.outputs.duration_seconds || 'n/a' }}s)"
            echo "- Build: ${{ needs.build.result }} (${{ needs.build.outputs.duration_seconds || 'n/a' }}s)"
            echo "- Deploy: ${{ needs.deploy.result }} (${{ needs.deploy.outputs.rollout_seconds || 'n/a' }}s)"
            echo "- Coolify deployment: ${{ needs.deploy.outputs.deployment_uuid || 'n/a' }}"
            echo "- Coolify status: ${{ needs.deploy.outputs.deployment_status || 'n/a' }}"
            echo "- Public canary: ${{ needs.canary.result }} (${{ needs.canary.outputs.duration_seconds || 'n/a' }}s)"
            echo "- Rollback: ${{ needs.rollback.result }}"
          } > "${report_file}"

          cat "${report_file}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-report-${{ github.run_id }}
          path: deploy-report/
          retention-days: 30
