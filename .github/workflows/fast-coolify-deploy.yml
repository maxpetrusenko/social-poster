name: Fast Coolify Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fast-coolify-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/maxpetrusenko/social-poster
  IMAGE_TAG: sha-${{ github.sha }}
  COOLIFY_UUID: ch6cjsgcqn6afd5052etgvwn
  COOLIFY_PORT: "3000"
  COOLIFY_HEALTH_PATH: /api/health

jobs:
  gate:
    name: Local Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: E2E tests
        run: npm run test:e2e

      - name: Browser tests
        run: npm run test:browser

  build:
    name: Build and Push GHCR Image
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Coolify Deploy
    runs-on: ubuntu-latest
    needs: build
    env:
      COOLIFY_BASE_URL: ${{ secrets.COOLIFY_API_URL || secrets.COOLIFY_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN || secrets.COOLIFY_TOKEN }}
    steps:
      - name: Validate Coolify credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_BASE_URL}" ]; then
            echo "::error::Set COOLIFY_API_URL or COOLIFY_URL"
            exit 1
          fi

          if [ -z "${COOLIFY_API_TOKEN}" ]; then
            echo "::error::Set COOLIFY_API_TOKEN or COOLIFY_TOKEN"
            exit 1
          fi

          api_base="${COOLIFY_BASE_URL%/}"
          api_base="${api_base%/api/v1}/api/v1"

          curl --fail-with-body --silent --show-error \
            --request GET \
            --url "${api_base}/applications/${COOLIFY_UUID}" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --output /dev/null

      - name: Deploy Coolify application
        shell: bash
        run: |
          set -euo pipefail

          api_base="${COOLIFY_BASE_URL%/}"
          api_base="${api_base%/api/v1}/api/v1"

          curl --fail-with-body --silent --show-error \
            --request GET \
            --url "${api_base}/deploy?uuid=${COOLIFY_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}"
