name: Fast Coolify Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fast-coolify-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/maxpetrusenko/social-poster
  IMAGE_TAG: sha-${{ github.sha }}
  COOLIFY_UUID: ch6cjsgcqn6afd5052etgvwn
  COOLIFY_PORT: "3000"
  COOLIFY_HEALTH_PATH: /api/health

jobs:
  gate:
    name: Local Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: E2E tests
        run: npm run test:e2e:ci

      - name: Browser tests
        run: npm run test:browser

  build:
    name: Build and Push GHCR Image
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

  deploy:
    name: Trigger Coolify Deploy
    runs-on: ubuntu-latest
    needs: build
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN || secrets.COOLIFY_TOKEN }}
      COOLIFY_SSH_HOST: ${{ secrets.COOLIFY_SSH_HOST || '173.249.52.27' }}
      COOLIFY_SSH_USER: ${{ secrets.COOLIFY_SSH_USER || 'root' }}
      COOLIFY_SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_PRIVATE_KEY }}
    steps:
      - name: Validate Coolify credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_API_TOKEN}" ]; then
            echo "::error::Set COOLIFY_API_TOKEN or COOLIFY_TOKEN"
            exit 1
          fi

          if [ -z "${COOLIFY_SSH_PRIVATE_KEY}" ]; then
            echo "::error::Set COOLIFY_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Deploy Coolify application over private SSH path
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          key_file="$HOME/.ssh/coolify_deploy_key"
          printf '%s\n' "${COOLIFY_SSH_PRIVATE_KEY}" > "${key_file}"
          chmod 600 "${key_file}"
          ssh-keyscan -H "${COOLIFY_SSH_HOST}" >> ~/.ssh/known_hosts

          token_b64="$(printf '%s' "${COOLIFY_API_TOKEN}" | base64 | tr -d '\n')"

          deploy_response="$(ssh -i "${key_file}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${COOLIFY_SSH_USER}@${COOLIFY_SSH_HOST}" \
            "COOLIFY_API_TOKEN_B64='${token_b64}' COOLIFY_UUID='${COOLIFY_UUID}' IMAGE_TAG='${IMAGE_TAG}' bash -s" <<'REMOTE'
          set -euo pipefail

          COOLIFY_API_TOKEN="$(printf '%s' "${COOLIFY_API_TOKEN_B64}" | base64 -d)"
          api_base="http://127.0.0.1:8000/api/v1"

          curl --fail --silent --show-error \
            --request PATCH \
            --url "${api_base}/applications/${COOLIFY_UUID}" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"docker_registry_image_tag\":\"${IMAGE_TAG}\"}" \
            >/dev/null

          curl --fail --silent --show-error \
            --request POST \
            --url "${api_base}/deploy?uuid=${COOLIFY_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}"
          REMOTE
          )"

          echo "${deploy_response}"

          deployment_uuid="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["deployments"][0]["deployment_uuid"])' \
              <<<"${deploy_response}"
          )"
          echo "Coolify deployment queued: ${deployment_uuid}"

          for attempt in $(seq 1 90); do
            status_response="$(ssh -i "${key_file}" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "${COOLIFY_SSH_USER}@${COOLIFY_SSH_HOST}" \
              "COOLIFY_API_TOKEN_B64='${token_b64}' DEPLOYMENT_UUID='${deployment_uuid}' bash -s" <<'REMOTE'
            set -euo pipefail
            COOLIFY_API_TOKEN="$(printf '%s' "${COOLIFY_API_TOKEN_B64}" | base64 -d)"
            curl --fail --silent --show-error \
              --url "http://127.0.0.1:8000/api/v1/deployments/${DEPLOYMENT_UUID}" \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}"
          REMOTE
            )"

            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"${status_response}")"
            echo "Coolify deployment status: ${status} (${attempt}/90)"

            if [ "${status}" = "finished" ]; then
              ssh -i "${key_file}" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                "${COOLIFY_SSH_USER}@${COOLIFY_SSH_HOST}" \
                "COOLIFY_UUID='${COOLIFY_UUID}' COOLIFY_HEALTH_PATH='${COOLIFY_HEALTH_PATH}' bash -s" <<'REMOTE'
              set -euo pipefail
              container_id="$(docker ps --filter "name=${COOLIFY_UUID}" --format "{{.ID}}" | sed -n '1p')"
              if [ -z "${container_id}" ]; then
                echo "No running container found for ${COOLIFY_UUID}" >&2
                exit 1
              fi
              docker exec "${container_id}" curl --fail --silent --show-error "http://127.0.0.1:3000${COOLIFY_HEALTH_PATH}" >/dev/null
          REMOTE
              echo "Private production healthcheck passed."
              exit 0
            fi

            if [ "${status}" != "in_progress" ] && [ "${status}" != "queued" ]; then
              echo "${status_response}"
              echo "::error::Coolify deployment ended with status ${status}"
              exit 1
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for Coolify deployment ${deployment_uuid}"
          exit 1
